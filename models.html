        const mainContent = document.getElementById('main-content');
        let currentBrand = null;
        let selectedCar = null;

        function getActualImageUrl(googleUrl) {
            try {
                const url = new URL(googleUrl);
                const query = url.searchParams.get('q');
                if (query) {
                    return decodeURIComponent(query);
                }
            } catch (e) {
                console.error("Invalid URL:", googleUrl);
            }
            return 'https://placehold.co/400x260/e5e7eb/6b7280?text=Image+Not+Found';
        }

        // Function to get unique brands from the data
        function getUniqueBrands() {
            const brands = carData.cars.map(car => car.make);
            return [...new Set(brands)];
        }

        // Renders the initial view with car brands
        function renderBrandList() {
            const uniqueBrands = getUniqueBrands();
            mainContent.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full mx-auto">
                    ${uniqueBrands.map(brand => `
                        <div class="bg-white rounded-xl card-shadow transform transition-transform hover:scale-105 duration-300 cursor-pointer text-center p-6" onclick="showModelsByBrand('${brand}')">
                            <h2 class="text-3xl font-bold text-gray-900 tracking-tight">${brand.toUpperCase()}</h2>
                            <p class="text-gray-500 mt-2">Browse Models</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Renders the list of car models for a selected brand
        function renderCarList(brand) {
            currentBrand = brand;
            const filteredCars = carData.cars.filter(car => car.make === brand);
            mainContent.innerHTML = `
                <div class="max-w-4xl mx-auto mb-6">
                    <button onclick="goBackToBrands()" class="flex items-center text-gray-600 hover:text-gray-900 transition-colors duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        Back to Brands
                    </button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full mx-auto">
                    ${filteredCars.map((car, index) => `
                        <div class="bg-white rounded-xl overflow-hidden card-shadow transform transition-transform hover:scale-105 duration-300 cursor-pointer" onclick="showCarDetails(${index})">
                            <div class="relative h-48 bg-gray-200 overflow-hidden">
                                <img src="${getActualImageUrl(car.image_url)}" alt="${car.make} ${car.model}" class="w-full h-full object-cover">
                            </div>
                            <div class="p-4 text-center">
                                <p class="text-sm font-semibold text-gray-500">${car.make.toUpperCase()}</p>
                                <h2 class="text-2xl font-bold text-gray-900 tracking-tight">${car.model.toUpperCase()}</h2>
                                <p class="text-sm font-light text-gray-500 mt-1">${car.year}</p>
                                <p class="text-lg font-semibold text-gray-700 mt-3">${car.price_launch}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Renders the detailed view of a car
        function renderCarDetails() {
            if (!selectedCar) return;

            const specsList = Object.entries(selectedCar.specs.engine_transmission).map(([key, value]) => `
                <li class="flex justify-between items-center py-2 border-b last:border-b-0">
                    <span class="text-gray-500 font-medium">${key}</span>
                    <span class="text-gray-900 font-semibold">${value}</span>
                </li>
            `).join('');

            const variantsList = selectedCar.price_variants.map(variant => `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center p-4 bg-gray-50 rounded-lg my-2">
                    <div class="mb-2 md:mb-0">
                        <h3 class="text-lg font-bold text-gray-800">${variant.name}</h3>
                        <p class="text-sm text-gray-500">${variant.engine_details}</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="text-xl font-bold text-gray-900">${variant.ex_showroom_price}</span>
                        <a href="#" class="link-text font-semibold">${variant.offers}</a>
                    </div>
                </div>
            `).join('');

            mainContent.innerHTML = `
                <div class="max-w-4xl mx-auto bg-white rounded-xl card-shadow p-6 md:p-8">
                    <button onclick="goBackToModels('${currentBrand}')" class="flex items-center text-gray-600 hover:text-gray-900 transition-colors duration-200 mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        Back to Models
                    </button>

                    <div class="flex flex-col md:flex-row gap-6 items-center">
                        <div class="flex-shrink-0 w-full md:w-1/2">
                            <img src="${getActualImageUrl(selectedCar.image_url)}" alt="${selectedCar.model}" class="rounded-lg w-full h-auto card-shadow object-cover">
                        </div>
                        <div class="flex-grow w-full md:w-1/2">
                            <h2 class="text-3xl sm:text-4xl font-bold text-gray-900 tracking-tight">${selectedCar.make.toUpperCase()} ${selectedCar.model.toUpperCase()}</h2>
                            <p class="text-gray-500 mt-2 text-lg">${selectedCar.year}</p>
                            <p class="text-xl font-bold text-gray-800 mt-4">${selectedCar.price_launch}</p>
                            <p class="text-sm text-gray-500 mt-1">${selectedCar.price_note}</p>
                            
                            <div class="mt-6">
                                <h3 class="text-xl font-bold text-gray-800 mb-4">Engine and Transmission Specs</h3>
                                <ul class="space-y-4 text-base">
                                    ${specsList}
                                </ul>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-8">
                        <h3 class="text-xl font-bold text-gray-800 mb-4">Available Variants</h3>
                        <div class="flex flex-col space-y-4">
                            ${variantsList}
                        </div>
                    </div>
                </div>
            `;
        }

        // Navigation functions
        window.showModelsByBrand = function(brand) {
            renderCarList(brand);
        };
        
        window.showCarDetails = function(index) {
            const filteredCars = carData.cars.filter(car => car.make === currentBrand);
            selectedCar = filteredCars[index];
            renderCarDetails();
        };

        window.goBackToBrands = function() {
            currentBrand = null;
            renderBrandList();
        };

        window.goBackToModels = function(brand) {
            renderCarList(brand);
        };

        // Initial render on page load
        renderBrandList();
    </script>

</html>
