<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 374" width="664" height="374">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="30%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="664" height="374" fill="url(#bg)" rx="0"/>
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.02" stroke-width="1"/>
  </pattern>
  <rect width="664" height="374" fill="url(#grid)"/>
  <!-- Top shine -->
  <rect width="664" height="180" fill="url(#shine)"/>
  <!-- Accent line -->
  <rect x="50" y="80" width="60" height="3" rx="1.5" fill="#d5a500" opacity="0.8"/>
  <!-- Brand name -->
  <text x="50" y="115" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="white" opacity="0.4" letter-spacing="3">PORSCHE</text>
  <!-- Car model name -->
  <text x="50" y="155" font-family="Inter,system-ui,sans-serif" font-size="32" font-weight="800" fill="white" opacity="0.95">911</text>
  <!-- Price -->
  <text x="50" y="185" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#d5a500" opacity="0.9">₹ 1.74 Cr - ₹ 1.88 Cr</text>
  <!-- Road line -->
  <rect x="0" y="280" width="664" height="1" fill="url(#road)"/>
  <!-- Car silhouette -->
  <g transform="translate(40,90) scale(1.05)" opacity="0.15">
    <path d="M100,195 L125,182 L145,168 L165,155 L200,148 L250,146 L310,147 L370,150 L420,155 L460,165 L500,178 L525,190 L535,195 L100,195 Z M148,195 A22,22 0 1,1 192,195 A22,22 0 1,1 148,195 Z M435,195 A22,22 0 1,1 479,195 A22,22 0 1,1 435,195 Z" fill="white"/>
  </g>
  <!-- Body type badge -->
  <rect x="540" y="30" width="69" height="26" rx="6" fill="#d5a500" opacity="0.2"/>
  <text x="552" y="48" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#d5a500">Coupe</text>
  <!-- Bottom gradient fade -->
  <rect x="0" y="290" width="664" height="84" fill="url(#bg)" opacity="0.5"/>
</svg>