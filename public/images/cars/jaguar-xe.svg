<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 374" width="664" height="374">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="30%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="664" height="374" fill="url(#bg)" rx="0"/>
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.02" stroke-width="1"/>
  </pattern>
  <rect width="664" height="374" fill="url(#grid)"/>
  <!-- Top shine -->
  <rect width="664" height="180" fill="url(#shine)"/>
  <!-- Accent line -->
  <rect x="50" y="80" width="60" height="3" rx="1.5" fill="#9b7b4a" opacity="0.8"/>
  <!-- Brand name -->
  <text x="50" y="115" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="white" opacity="0.4" letter-spacing="3">JAGUAR</text>
  <!-- Car model name -->
  <text x="50" y="155" font-family="Inter,system-ui,sans-serif" font-size="32" font-weight="800" fill="white" opacity="0.95">Xe</text>
  <!-- Price -->
  <text x="50" y="185" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#9b7b4a" opacity="0.9">₹ 44.98 Lakh - ₹ 46.33 Lakh</text>
  <!-- Road line -->
  <rect x="0" y="280" width="664" height="1" fill="url(#road)"/>
  <!-- Car silhouette -->
  <g transform="translate(40,90) scale(1.05)" opacity="0.15">
    <path d="M85,195 L105,185 L120,175 L135,162 L155,152 L190,148 L230,146 L320,146 L380,146 L420,148 L465,150 L500,158 L525,170 L540,180 L550,190 L555,195 L85,195 Z M140,195 A24,24 0 1,1 188,195 A24,24 0 1,1 140,195 Z M440,195 A24,24 0 1,1 488,195 A24,24 0 1,1 440,195 Z" fill="white"/>
  </g>
  <!-- Body type badge -->
  <rect x="540" y="30" width="69" height="26" rx="6" fill="#9b7b4a" opacity="0.2"/>
  <text x="552" y="48" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#9b7b4a">Sedan</text>
  <!-- Bottom gradient fade -->
  <rect x="0" y="290" width="664" height="84" fill="url(#bg)" opacity="0.5"/>
</svg>